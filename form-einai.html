<!DOCTYPE html>
<html data-bs-theme="light" lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Inscrição — Treinamento</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Aboreto&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Abril+Fatface&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins:400,500,600,700,800&amp;display=swap">
    <link rel="stylesheet" href="assets/css/Features-Image-icons.css">
    <link rel="stylesheet" href="assets/css/forms-einai.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
    <main class="wrap-forms">
        <section class="card-forms" aria-labelledby="title">
            <div class="hero-forms"><img src="/mnt/data/461ec3f8-4201-40b8-a032-4d3b749c93fe.png" alt="thumb">
                <div class="titles-forms">
                    <h1 id="title">Inscreva-se no Treinamento</h1>
                    <p class="subtitle-forms">Rápido — sem spam. Respondas e nós entraremos em contato.</p>
                </div>
            </div>
            <form id="form" novalidate="">
                <div class="field-forms"><label for="nome">Nome completo</label><input type="text" autocomplete="name" id="nome" inputmode="text" name="nome" placeholder="Seu nome completo" required=""></div>
                <div class="row-forms">
                    <div class="field-forms"><label for="nascimento">Data de nascimento</label><input id="nascimento" name="nascimento" type="date" required=""></div>
                    <div class="field-forms"><label for="telefone">Telefone</label><input type="tel" id="telefone" inputmode="tel" name="telefone" placeholder="55 51 99999-9999" required=""></div>
                </div>
                <div class="field-forms"><label for="email">E-mail</label><input type="email" autocomplete="email" id="email" name="email" placeholder="seu@exemplo.com" required=""></div>
                <div class="field-forms"><label>Por que você quer fazer o curso/treinamento? <span class="helper-forms">(Escolha uma ou mais)</span></label>
                    <div class="checkbox-grid-forms" role="group" aria-label="Por que quer fazer o curso"><label class="option-forms"><input type="checkbox" name="motivo" value="Aprender algo novo para minha carreira"><div class="opt-text-forms"><span class="opt-title-forms">Aprender algo novo</span><span class="opt-desc-forms">Quero habilidades práticas para crescer na minha função.</span></div></label><label class="option-forms"><input type="checkbox" name="motivo" value="Mudar de área"><div class="opt-text-forms"><span class="opt-title-forms">Mudar de área</span><span class="opt-desc-forms">Estou buscando transição para uma nova carreira.</span></div></label><label class="option-forms"><input type="checkbox" name="motivo" value="Melhorar resultados profissionais"><div class="opt-text-forms"><span class="opt-title-forms">Melhorar resultados</span><span class="opt-desc-forms">Desejo aplicar o conteúdo para ter impacto no trabalho.</span></div></label><label class="option-forms"><input type="checkbox" name="motivo" value="Recomendado por alguém"><div class="opt-text-forms"><span class="opt-title-forms">Recomendado</span><span class="opt-desc-forms">Alguém me indicou este treinamento.</span></div></label><label class="option-forms"><input type="checkbox" name="motivo" value="Interesse no conteúdo"><div class="opt-text-forms"><span class="opt-title-forms">Interesse no conteúdo</span><span class="opt-desc-forms">O tema me interessa e quero me aprofundar.</span></div></label><label class="option-forms"><input type="checkbox" name="motivo" value="Outro"><div class="opt-text-forms"><span class="opt-title-forms">Outro</span><span class="opt-desc-forms">Outra razão não listada acima.</span></div></label></div>
                </div>
                <div class="field-forms"><label>O que te impede hoje de fazer o curso/treinamento? <span class="helper-forms">(Escolha o que se aplica)</span></label>
                    <div class="checkbox-grid-forms" role="group" aria-label="O que te impede"><label class="option-forms"><input type="checkbox" name="impedimento" value="Falta de tempo"><div class="opt-text-forms"><span class="opt-title-forms">Falta de tempo</span><span class="opt-desc-forms">Minha rotina atual não permite dedicar horas ao curso.</span></div></label><label class="option-forms"><input type="checkbox" name="impedimento" value="Falta de dinheiro"><div class="opt-text-forms"><span class="opt-title-forms">Falta de dinheiro</span><span class="opt-desc-forms">No momento não consigo arcar com o investimento.</span></div></label><label class="option-forms"><input type="checkbox" name="impedimento" value="Medo de não acompanhar"><div class="opt-text-forms"><span class="opt-title-forms">Medo de não acompanhar</span><span class="opt-desc-forms">Tenho receio de não conseguir acompanhar o ritmo.</span></div></label><label class="option-forms"><input type="checkbox" name="impedimento" value="Já tentei antes e não deu certo"><div class="opt-text-forms"><span class="opt-title-forms">Tentativa anterior</span><span class="opt-desc-forms">Já tentei cursos antes e não tive sucesso.</span></div></label><label class="option-forms"><input type="checkbox" name="impedimento" value="Não tenho certeza se é para mim"><div class="opt-text-forms"><span class="opt-title-forms">Incerteza</span><span class="opt-desc-forms">Não tenho certeza se o curso se encaixa no meu perfil.</span></div></label><label class="option-forms"><input type="checkbox" name="impedimento" value="Outro"><div class="opt-text-forms"><span class="opt-title-forms">Outro</span><span class="opt-desc-forms">Outro motivo não listado.</span></div></label></div>
                </div>
                <div class="actions-forms"><button type="submit" id="submitBtn" aria-live="polite"><span id="btnLabel">Enviar respostas</span><span id="btnSpinner" class="spinner-forms" style="display:none;"></span></button>
                    <div class="status-forms" id="status" role="status" aria-atomic="true"></div>
                </div>
            </form>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/bs-init.js"></script>
    <script src="assets/js/forms-einai.js"></script>
</body>

</html>
